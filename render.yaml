# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: ai-subs-phase-1
    runtime: node
    buildCommand: npm ci && npm run check && npm test
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: LIGHTSTORE_API_KEY
        sync: false
      - key: LIGHTSTORE_API_BASE_URL
        value: https://api.light-store.net/api/v1
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: AUTO_PURCHASE_ENABLED
        value: 'false'
